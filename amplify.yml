# AWS Amplify Hosting build for the Bridge Next.js app. See docs/deploy-aws-amplify.md.
# Mirrors netlify.toml: Node 22, `npm run build`, server output in .next.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - node --version
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # write-build-info.mjs reads Netlify's COMMIT_REF/CONTEXT; map Amplify's
        # AWS_BRANCH onto CONTEXT. AWS_COMMIT_ID is the literal "HEAD" on rebuilds (env var
        # change, Redeploy), so read the SHA from git and keep AWS_COMMIT_ID only as fallback.
        - COMMIT_REF="$(git rev-parse HEAD 2>/dev/null || echo "$AWS_COMMIT_ID")" CONTEXT="$(if [ "$AWS_BRANCH" = production ]; then echo production; else echo branch-deploy; fi)" npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
